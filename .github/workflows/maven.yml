name: Maven CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Validate and Compile
      run: mvn clean validate compile

    - name: Run Checkstyle
      run: mvn checkstyle:check

    - name: Run Tests
      run: mvn test

    - name: Build with Spotless Check (if added later)
      run: mvn spotless:check
      continue-on-error: true  # Optional until Spotless is implemented

env:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
